services:
  web:
    build: .
    command: bash -c "python manage.py makemigrations && python manage.py migrate && 
      python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/static
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - ./.env

  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web

  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgres/data
    env_file:
      - ./.env
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 15s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: .
    command: celery -A config worker -l INFO
    volumes:
      - .:/app
    depends_on:
      - web
    env_file:
      - ./.env

  celery_beat:
    restart: on-failure
    build:
      context: .
    command: sh -c "sleep 10 && celery -A config beat -l info -S django"
    volumes:
      - .:/app
    depends_on:
      - web
    env_file:
      - ./.env

volumes:
  postgres_data:
  static_volume:
  redis_data:
